<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fractal Explorer</title>
  <!-- The icon is declared RELATIVE, like every other path in this app, so it
       resolves under the published subpath. Without this the browser falls back
       to /favicon.ico at the HOST root, which 404s (docs/STATE.md TRAP). -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles/fractVibeSplash.css">
</head>
<body>
  <div id="fractVibeSplash">Fract Vibe</div>
  <!-- Progress bar for 3D calculation -->
  <div id="fractal3d-progress" style="position:fixed;top:0;left:0;width:100vw;height:4px;background:#222;z-index:9999;display:none;">
    <div id="fractal3d-progress-bar" style="width:0;height:100%;background:linear-gradient(90deg,#26f,#2ff,#6f6,#ff6,#f66);transition:width 0.2s;"></div>
  </div>
  <div id="controls">
    <label for="fractalType">Fractal:</label>
    <!-- No <option> markup: app.js populates both selects from the kernel's ONE
         type/palette table (public/fractalKernel.js), so no name is restated here. -->
    <select id="fractalType"></select>
    <label for="colorScheme">Color Scheme:</label>
    <select id="colorScheme"></select>
    <label for="maxIter">Iterations:</label>
    <!-- No `max` attribute: app.js sets it from the kernel's MAX_ITER, the same
         constant the worker, the 3D heightmap and the shader loop bound derive
         from. The old hardcoded max="2000" was the UI half of B5. -->
    <input type="range" id="maxIter" min="50" value="256" step="1" style="vertical-align:middle;">
    <span id="maxIterValue">256</span>
    <label for="cycleColors"><input type="checkbox" id="cycleColors" checked> Cycle Colors</label>
    <label for="webglRender"><input type="checkbox" id="webglRender" checked> WebGL GPU Rendering</label>
    <span id="info"></span>
    <span id="renderTime" style="margin-left:1em;color:#888;"></span>
    <button id="saveLocationBtn" style="margin-left:1em;">Save Location</button>
    <button id="loadLocationBtn">Load Location</button>
  </div>
  <div id="loadLocationModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0008;z-index:2000;align-items:center;justify-content:center;">
    <div style="background:#222;padding:2em 2em 1em 2em;border-radius:10px;min-width:320px;max-width:90vw;max-height:80vh;overflow:auto;color:#fff;">
      <h3>Saved Locations</h3>
      <div style="display:flex;align-items:center;gap:1em;margin-bottom:0.5em;">
        <label for="locationSortSelect">Sort by:</label>
        <select id="locationSortSelect" style="font-size:1em;padding:0.1em 0.5em;">
          <option value="timestamp">Most Recent</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div id="savedLocationsList" style="max-height:40vh;overflow-y:auto;padding:0;margin:0 0 1em 0;"></div>
      <div id="loadLocationFooter" style="display:flex;align-items:center;gap:1em;padding-top:1em;border-top:1px solid #333;">
        <button id="exportLocationsBtn" style="background:#444;color:#ffe066;border:none;border-radius:5px;padding:0.4em 1.2em;cursor:pointer;">Export</button>
        <button id="importLocationsBtn" style="background:#ffe066;color:#222;border:none;border-radius:5px;padding:0.4em 1.2em;cursor:pointer;">Import</button>
        <button id="closeLoadLocationModal" style="margin-left:auto;">Close</button>
      </div>
    </div>
  </div>
  <div id="saveLocationConfirmation" style="display:none;position:fixed;top:32px;left:50%;transform:translateX(-50%);background:#222;color:#ffe066;padding:0.7em 2em;border-radius:8px;font-size:1.2em;z-index:3000;box-shadow:0 2px 16px #0008;opacity:0;transition:opacity 0.7s;pointer-events:none;">Location saved!</div>
  <!-- S6: non-modal naming surface for Save Location. Replaces window.prompt,
       which blocked the page and had no cancel/dismiss path the app controlled.
       Save commits; Cancel stores nothing (the prompt's null branch). -->
  <div id="saveLocationPanel" style="display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:3500;align-items:center;gap:0.5em;background:rgba(30,30,30,0.96);border:1px solid #555;border-radius:8px;padding:0.6em 1em;box-shadow:0 2px 16px #0008;">
    <label for="saveLocationName" style="color:#ffe066;">Name this location (optional):</label>
    <input id="saveLocationName" type="text" style="min-width:18em;padding:0.3em 0.5em;border-radius:5px;border:1px solid #777;background:#111;color:#eee;">
    <button id="saveLocationConfirm" style="background:#ffe066;color:#222;border:none;border-radius:5px;padding:0.35em 1em;cursor:pointer;font-weight:bold;">Save</button>
    <button id="saveLocationCancel" style="background:#444;color:#ffe066;border:none;border-radius:5px;padding:0.35em 1em;cursor:pointer;">Cancel</button>
  </div>
  <!-- S6: non-modal GPU zoom-cap offer. Replaces window.confirm. Shown at most
       once; the cap is applied by the clamp regardless of which button is used
       (or of no button being used at all). -->
  <div id="zoomCapOffer" role="status" aria-live="polite" style="display:none;position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:3500;align-items:center;gap:0.8em;background:rgba(30,30,30,0.96);border:1px solid #ffe066;border-radius:8px;padding:0.6em 1em;color:#ffe066;box-shadow:0 2px 16px #0008;">
    <span>Zoom limit reached for GPU mode. Switch to CPU mode for deeper zoom?</span>
    <button id="zoomCapSwitchToCpu" style="background:#ffe066;color:#222;border:none;border-radius:5px;padding:0.35em 1em;cursor:pointer;font-weight:bold;">Switch to CPU</button>
    <button id="zoomCapDismiss" style="background:#444;color:#ffe066;border:none;border-radius:5px;padding:0.35em 1em;cursor:pointer;">Stay on GPU</button>
  </div>
  <!-- Non-modal failure/status surface: renderer fallbacks and the global error
       net report here instead of an alert (S1/B9). -->
  <div id="appMessage" role="status" aria-live="polite" style="display:none;"></div>
  <canvas id="fractalCanvas"></canvas>
  <canvas id="fractalCanvasWebGL" style="display:none;"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
